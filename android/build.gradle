// This configures Gradle itself and the repositories shared by Android modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {

        // These are build plugins, not libraries the game's JavaScript imports.
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Each module resolves its native dependencies from these repositories.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}


// Gradle's clean task removes generated build output, not authored game source.
task clean(type: Delete) {
    delete rootProject.buildDir
}
