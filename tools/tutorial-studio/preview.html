<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disposable Studio stage</title><link rel="stylesheet" href="/style.css"><style>html,body{margin:0;overflow:hidden;background:#10131a}#game{position:absolute;inset:0}</style></head><body><div id="game"></div>
<script>
// This runs before any game module. Preview writes cannot reach the normal profile.
window.__tutorialStudioPreview = true;
const values=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>values.get(String(k))??null,setItem:(k,v)=>values.set(String(k),String(v)),removeItem:k=>values.delete(String(k)),clear:()=>values.clear(),key:i=>[...values.keys()][i]??null,get length(){return values.size;}}});
</script><script type="module" src="./preview.js"></script></body></html>
